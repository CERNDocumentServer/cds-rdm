[project]
name = "cds-rdm-app"
version = "2.5.1"
authors = [
    { name = "CERN" }
]
license = "GPL-2.0"
requires-python = "~=3.14.0"
dependencies = [
    "invenio-app-rdm[opensearch2, profiler]==v15.0.0b7.dev0",
    "invenio-cern-sync",
    "invenio-preservation-sync==0.5.0",
    "invenio-vcs>=0.0.1",
    "cds-rdm",
    "lxml>=4.6.5",
    "s3fs>=2024.6.1",  # extra of invenio-vocabularies for ORCiD dump
    "uwsgi>=2.0",
    "uwsgitop>=0.11",
    "uwsgi-tools>=1.1.1"
]

[tool.uv.sources]
cds-rdm = { workspace = true }
invenio-cern-sync = { git = "https://github.com/CERNDocumentServer/invenio-cern-sync", rev = "v0.8.0" }

[tool.uv.workspace]
members = [
    "site",
]

[dependency-groups]
dev = [
    "pytest-invenio>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
sentry = [
    "invenio-logging[sentry]",
]
xrootd = [
    "invenio-xrootd==3.1.0",
    "requests-kerberos==0.14.0",
    "xrootd==5.9.6",
]

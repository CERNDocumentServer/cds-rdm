[project]
name = "cds-rdm-app"
version = "1.32.0"
authors = [
    { name = "CERN" }
]
license = "GPL-2.0"
requires-python = ">=3.9"
dependencies = [
    "invenio-app-rdm[opensearch2] @ git+https://github.com/inveniosoftware/invenio-app-rdm@master",
    "invenio-cern-sync",
    "invenio-preservation-sync @ git+https://github.com/palkerecsenyi/invenio-preservation-sync.git@bump-deps",
    "invenio-vcs>=0.0.1",
    "cds-rdm",
    "lxml>=4.6.5",
    "s3fs>=2024.6.1",  # extra of invenio-vocabularies for ORCiD dump
    "uwsgi>=2.0",
    "uwsgitop>=0.11",
    "uwsgi-tools>=1.1.1"
]

[tool.uv]
override-dependencies = [
    "invenio-rdm-records @ git+https://github.com/palkerecsenyi/invenio-rdm-records@new-version-overridable"
]

[tool.uv.sources]
cds-rdm = { workspace = true }
invenio-cern-sync = { git = "https://github.com/palkerecsenyi/invenio-cern-sync", branch = "bump-deps" }

[tool.uv.workspace]
members = [
    "site",
]

[dependency-groups]
dev = [
    "pytest-invenio>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
sentry = [
    "sentry-sdk>=1.45,<2.0.0",
]
xrootd = [
    "invenio-xrootd==2.0.0a2",
    "requests-kerberos==0.14.0",
]

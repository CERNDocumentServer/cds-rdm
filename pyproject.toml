[project]
name = "cds-rdm-app"
version = "2.1.0"
authors = [
    { name = "CERN" }
]
license = "GPL-2.0"
requires-python = ">=3.9"
dependencies = [
    "invenio-app-rdm[opensearch2]>=v15.0.0b2.dev1",
    "invenio-cern-sync",
    "invenio-preservation-sync==0.5.0",
    "invenio-vcs>=0.0.1",
    "cds-rdm",
    "lxml>=4.6.5",
    "s3fs>=2024.6.1",  # extra of invenio-vocabularies for ORCiD dump
    "uwsgi>=2.0",
    "uwsgitop>=0.11",
    "uwsgi-tools>=1.1.1"
]

[tool.uv]
override-dependencies = [
    # On Python <=3.9 type hints require a manual import of __annotations__.
    # fastjsonschema>=2.22 starts to use type hints without this manual import and is
    # therefore incompatible with Python <=3.9. See https://github.com/horejsek/python-fastjsonschema/issues/211
    # Their minimum Python version has now been set to 3.10 for >=2.22
    "fastjsonschema<2.22"
]

[tool.uv.sources]
cds-rdm = { workspace = true }
invenio-cern-sync = { git = "https://github.com/CERNDocumentServer/invenio-cern-sync", rev = "v0.8.0" }

[tool.uv.workspace]
members = [
    "site",
]

[dependency-groups]
dev = [
    "pytest-invenio>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
sentry = [
    "sentry-sdk>=1.45,<2.0.0",
]
xrootd = [
    "invenio-xrootd==2.0.0a2",
    "requests-kerberos==0.14.0",
]
